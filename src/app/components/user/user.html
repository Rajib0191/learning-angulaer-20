<div class="container mt-3">
  <div class="row">
    <h1>User CURD Operation</h1>

    <!-- User Cards Section -->
    <div class="col-8">
      <div class="card shadow">
        <div class="card-header fw-bold">User List</div>
        <div class="card-body">
          <div class="row g-3">
            @for (item of userList$ |async; track $index) {
            <div class="col-md-6">
              <div class="card user-card shadow-sm border-0">
                <div class="card-body">
                  <h5 class="card-title mb-1">{{ item.fullName }}</h5>
                  <p class="text-muted mb-1"><strong>Email:</strong>{{ item.emailId }}</p>
                  <p class="text-muted mb-1"><strong>Mobile:</strong>{{ item.mobileNo }}</p>
                  <p class="text-muted mb-1"><strong>Password:</strong>{{ item.password }}</p>
                  <div class="mt-3 text-end">
                    <button class="btn btn-sm btn-primary me-1" (click)="onEdit(item)">Edit</button>
                    <button class="btn btn-sm btn-danger">Delete</button>
                  </div>
                </div>
              </div>
            </div>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="col-4">
      <div class="card shadow">
        <div class="card-header fw-bold">Add / Edit User</div>
        <div class="card-body bg-white rounded">
          <form [formGroup]="userForm">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input
                type="text"
                formControlName="fullName"
                class="form-control"
                id="fullName"
                placeholder="Enter full name"
              />
            </div>

            <div class="mb-3">
              <label for="emailId" class="form-label">Email</label>
              <input
                type="email"
                formControlName="emailId"
                class="form-control"
                id="emailId"
                placeholder="Enter email address"
              />
            </div>

            <div class="mb-3">
              <label for="mobileNo" class="form-label">Mobile No</label>
              <input
                type="text"
                formControlName="mobileNo"
                class="form-control"
                id="mobileNo"
                placeholder="Enter mobile number"
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                formControlName="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
              />
            </div>

            <div class="text-end">
              @if (userForm.controls['userId'].value === 0) {
              <button type="submit" (click)="onSaveUser()" class="btn btn-success me-2">
                Save
              </button>
              }@else {
              <button type="submit" (click)="onUpdateUser()" class="btn btn-warning me-2">
                Update
              </button>
              }
              <button type="reset" class="btn btn-secondary" (click)="onClear()">Clear</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
